<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>
</head>

<body>

    <h1 id="welcome"></h1>

    <script>
        let params = new URLSearchParams(window.location.search);
        let username = params.get("username");

        document.getElementById("welcome").innerHTML =
            "<b><big>Welcome " + username + "</big></b>";
    </script>

</body>
</html>
